x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10mb"

x-app-dependencies: &app-dependencies
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  postgres:
    image: docker.io/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB__NAME}
      POSTGRES_USER: ${DB__USER}
      POSTGRES_PASSWORD: ${DB__PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB__USER} -d ${DB__NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  redis:
    image: docker.io/redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS__PASSWORD:?REDIS__PASSWORD is required}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  postgres-backup:
    # Nightly pg_dump into its own volume with retention. The database holds
    # user feedback and taste profiles — the one dataset that cannot be
    # re-scraped — so it gets the only backup in the stack.
    image: docker.io/postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${DB__NAME}
      PGUSER: ${DB__USER}
      PGPASSWORD: ${DB__PASSWORD}
      BACKUP_RETENTION_DAYS: 14
      BACKUP_INTERVAL_SECONDS: 86400
    volumes:
      - postgres_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        echo "postgres-backup: first dump at startup, then every $${BACKUP_INTERVAL_SECONDS}s"
        while true; do
          ts=$$(date +%Y%m%d_%H%M%S)
          pg_dump --format=custom --file="/backups/krisha_$${ts}.dump"
          echo "postgres-backup: wrote krisha_$${ts}.dump"
          find /backups -name 'krisha_*.dump' -mtime +$${BACKUP_RETENTION_DAYS} -delete
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done
    logging: *default-logging

  migrate:
    image: localhost/krisha-agent:dev
    build:
      context: .
      dockerfile: Containerfile
    env_file:
      - .env
    command: ["alembic", "upgrade", "head"]
    depends_on: *app-dependencies
    restart: "no"
    logging: *default-logging

  bot:
    image: localhost/krisha-agent:dev
    build:
      context: .
      dockerfile: Containerfile
    env_file:
      - .env
    command: ["python", "-m", "bot"]
    depends_on: *app-dependencies
    restart: unless-stopped
    logging: *default-logging

  scheduler-producer:
    image: localhost/krisha-agent:dev
    build:
      context: .
      dockerfile: Containerfile
    env_file:
      - .env
    environment:
      SCHEDULER__RUNTIME: arq
    command: ["python", "-m", "scheduler"]
    depends_on: *app-dependencies
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging

  scheduler-worker:
    image: localhost/krisha-agent:dev
    build:
      context: .
      dockerfile: Containerfile
    env_file:
      - .env
    command: ["arq", "scheduler.arq_worker.WorkerSettings"]
    depends_on: *app-dependencies
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres_data:
  postgres_backups:
  redis_data:
