name: CD

# Push to main: run the full test suite and build+smoke+push the image in
# parallel. There is no deployment target right now — the GHCR image (tagged
# both :latest and sha-<commit>) is the artifact; whenever a server exists
# again, re-add an SSH deploy job or run the stack from
# podman-compose.prod.yml manually.
on:
  push:
    branches:
      - main

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-push:
    uses: ./.github/workflows/container.yml
    permissions:
      contents: read
      packages: write
